<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Battle Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .menu {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #fff;
      color: #667eea;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #667eea;
      color: white;
      transform: scale(1.05);
    }

    .battle-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .fighter-side {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .fighter-side h2 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .fighter-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .fighter-name {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .fighter-gender {
      font-size: 0.9em;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .fighter-types {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .type-badge {
      background: rgba(255, 255, 255, 0.3);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }

    .hp-bar {
      background: rgba(0, 0, 0, 0.2);
      height: 20px;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }

    .hp-fill {
      background: #4caf50;
      height: 100%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.8em;
    }

    .hp-fill.warning {
      background: #ff9800;
    }

    .hp-fill.danger {
      background: #f44336;
    }

    .stats {
      font-size: 0.9em;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-top: 10px;
    }

    .stat {
      background: rgba(0, 0, 0, 0.1);
      padding: 5px;
      border-radius: 3px;
    }

    .moves {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .move-btn {
      background: #667eea;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .move-btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .move-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .battle-log {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      grid-column: 1 / -1;
      max-height: 300px;
      overflow-y: auto;
    }

    .battle-log h3 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .log-entry {
      padding: 8px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-left: 3px solid #667eea;
      border-radius: 3px;
      font-size: 0.95em;
    }

    .log-entry.action {
      border-left-color: #4caf50;
    }

    .log-entry.damage {
      border-left-color: #f44336;
    }

    .log-entry.status {
      border-left-color: #ff9800;
    }

    .fighter-selector {
      margin-bottom: 20px;
    }

    .fighter-selector h3 {
      color: white;
      margin-bottom: 10px;
    }

    .fighter-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .fighter-option {
      background: white;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .fighter-option:hover {
      background: #667eea;
      color: white;
      border-color: white;
    }

    .fighter-option.selected {
      background: #764ba2;
      color: white;
      border-color: white;
    }

    @media (max-width: 768px) {
      .battle-container {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.8em;
      }

      .menu {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    .status-display {
      font-size: 0.85em;
      margin-top: 5px;
      padding: 5px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }

    .status-display.burn {
      background: #ff5252;
      color: white;
    }

    .status-display.poison {
      background: #9c27b0;
      color: white;
    }

    .status-display.paralysis {
      background: #ffc107;
      color: black;
    }

    .status-display.sleep {
      background: #2196f3;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Pokémon Battle Simulator</h1>
      <p>Gen 9 Accurate Damage Calculator | 1v1 & 6v6 Battles</p>
    </header>

    <div class="menu">
      <button onclick="showFighterSelector('1v1')">Start 1v1 Battle</button>
      <button onclick="showFighterSelector('6v6')">Start 6v6 Team Battle</button>
      <button onclick="resetPage()">Reset</button>
    </div>

    <div id="fighterSelector" style="display: none;">
      <div style="background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px;">
        <h2 id="selectorTitle"></h2>
        
        <div id="team1Selector" style="margin-bottom: 20px;">
          <h3 style="color: #667eea; margin-bottom: 10px;">Player 1 Team</h3>
          <div id="team1List" class="fighter-list"></div>
        </div>

        <div id="team2Selector" style="margin-bottom: 20px;">
          <h3 style="color: #667eea; margin-bottom: 10px;">Player 2 Team</h3>
          <div id="team2List" class="fighter-list"></div>
        </div>

        <button onclick="startBattle()" style="width: 100%; padding: 15px; font-size: 1.1em;">Start Battle</button>
      </div>
    </div>

    <div id="battleContainer" style="display: none;">
      <div class="battle-container">
        <div class="fighter-side">
          <h2>Player 1</h2>
          <div id="player1Fighter" class="fighter-card"></div>
          <div id="player1Moves" class="moves"></div>
        </div>

        <div class="fighter-side">
          <h2>Player 2</h2>
          <div id="player2Fighter" class="fighter-card"></div>
          <div id="player2Moves" class="moves"></div>
        </div>

        <div class="battle-log">
          <h3>Battle Log</h3>
          <div id="logContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentBattle = null;
    let selectedTeam1 = [];
    let selectedTeam2 = [];
    let battleMode = '1v1';
    let allFighters = [];

    async function loadFighters() {
      try {
        const response = await fetch('/api/fighters');
        allFighters = await response.json();
      } catch (error) {
        console.error('Error loading fighters:', error);
      }
    }

    async function showFighterSelector(mode) {
      battleMode = mode;
      document.getElementById('fighterSelector').style.display = 'block';
      document.getElementById('selectorTitle').textContent = `Select Teams for ${mode} Battle`;

      const team1List = document.getElementById('team1List');
      const team2List = document.getElementById('team2List');

      team1List.innerHTML = '';
      team2List.innerHTML = '';

      allFighters.forEach(fighter => {
        // Team 1
        const option1 = document.createElement('div');
        option1.className = 'fighter-option';
        option1.textContent = `${fighter.name} (${fighter.gender})`;
        option1.onclick = () => toggleFighter(fighter.id, 1, option1);
        team1List.appendChild(option1);

        // Team 2
        const option2 = document.createElement('div');
        option2.className = 'fighter-option';
        option2.textContent = `${fighter.name} (${fighter.gender})`;
        option2.onclick = () => toggleFighter(fighter.id, 2, option2);
        team2List.appendChild(option2);
      });
    }

    function toggleFighter(fighterId, team, element) {
      const targetTeam = team === 1 ? selectedTeam1 : selectedTeam2;
      const maxSize = battleMode === '1v1' ? 1 : 6;

      if (targetTeam.includes(fighterId)) {
        targetTeam.splice(targetTeam.indexOf(fighterId), 1);
        element.classList.remove('selected');
      } else {
        if (targetTeam.length < maxSize) {
          targetTeam.push(fighterId);
          element.classList.add('selected');
        }
      }
    }

    async function startBattle() {
      if (selectedTeam1.length === 0 || selectedTeam2.length === 0) {
        alert('Please select fighters for both teams!');
        return;
      }

      try {
        const endpoint = battleMode === '1v1' ? '/api/battles/1v1' : '/api/battles/6v6';
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fighter1Id: selectedTeam1[0],
            fighter2Id: selectedTeam2[0],
            team1: selectedTeam1,
            team2: selectedTeam2,
          }),
        });

        if (response.ok) {
          const data = await response.json();
          currentBattle = data;
          document.getElementById('fighterSelector').style.display = 'none';
          document.getElementById('battleContainer').style.display = 'block';
          updateBattleDisplay();
        }
      } catch (error) {
        console.error('Error starting battle:', error);
      }
    }

    function updateBattleDisplay() {
      if (!currentBattle) return;

      const state = currentBattle.state;
      const p1Fighter = state.player1.fighters[state.player1.currentIndex];
      const p2Fighter = state.player2.fighters[state.player2.currentIndex];

      // Update fighter displays
      updateFighterDisplay('player1Fighter', p1Fighter);
      updateFighterDisplay('player2Fighter', p2Fighter);

      // Update move buttons
      updateMoveButtons('player1Moves', p1Fighter, 'player1');
      updateMoveButtons('player2Moves', p2Fighter, 'player2');

      // Update battle log
      updateBattleLog();
    }

    function updateFighterDisplay(elementId, fighter) {
      const element = document.getElementById(elementId);
      const hpPercent = (fighter.currentHp / fighter.maxHp) * 100;
      const pronoun = fighter.fighter.gender === 'female' ? 'She' : 'He';

      let hpClass = 'hp-fill';
      if (hpPercent <= 25) hpClass += ' danger';
      else if (hpPercent <= 50) hpClass += ' warning';

      let statusHtml = '';
      if (fighter.status !== 'none') {
        statusHtml = `<div class="status-display ${fighter.status}">${fighter.status.toUpperCase()}</div>`;
      }

      element.innerHTML = `
        <div class="fighter-name">${fighter.fighter.name} <span style="font-size: 0.8em;">(${fighter.fighter.gender})</span></div>
        <div class="fighter-gender">${pronoun} fights with determination!</div>
        <div class="fighter-types">
          ${fighter.fighter.types.map(t => `<div class="type-badge">${t.toUpperCase()}</div>`).join('')}
        </div>
        <div class="hp-bar">
          <div class="${hpClass}" style="width: ${Math.max(0, hpPercent)}%">
            ${Math.ceil(fighter.currentHp)} / ${fighter.maxHp}
          </div>
        </div>
        <div class="stats">
          <div class="stat">ATK: ${fighter.fighter.stats.attack}</div>
          <div class="stat">DEF: ${fighter.fighter.stats.defense}</div>
          <div class="stat">SP.ATK: ${fighter.fighter.stats.spAtk}</div>
          <div class="stat">SP.DEF: ${fighter.fighter.stats.spDef}</div>
          <div class="stat">SPD: ${fighter.fighter.stats.speed}</div>
        </div>
        ${statusHtml}
      `;
    }

    function updateMoveButtons(elementId, fighter, player) {
      const element = document.getElementById(elementId);
      element.innerHTML = fighter.fighter.moves
        .map(moveId => {
          const move = allFighters[0]?.moves?.find(m => m.id === moveId);
          return `
            <button class="move-btn" onclick="executeMove('${player}', '${moveId}')">
              ${moveId.toUpperCase()}
            </button>
          `;
        })
        .join('');
    }

    function updateBattleLog() {
      const logContainer = document.getElementById('logContainer');
      logContainer.innerHTML = currentBattle.log
        .map(entry => {
          let className = 'log-entry';
          if (entry.includes('fainted')) className += ' damage';
          else if (entry.includes('paralyzed') || entry.includes('poisoned') || entry.includes('burned')) className += ' status';
          else if (entry.includes('used')) className += ' action';

          return `<div class="${className}">${entry}</div>`;
        })
        .join('');

      logContainer.scrollTop = logContainer.scrollHeight;
    }

    async function executeMove(player, moveId) {
      if (!currentBattle) return;

      try {
        const response = await fetch(`/api/battles/${currentBattle.battleId}/action`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            player,
            action: { type: 'move', moveId },
          }),
        });

        if (response.ok) {
          currentBattle = await response.json();
          updateBattleDisplay();

          if (currentBattle.state.isOver) {
            alert(`Battle Over! ${currentBattle.state.winner} wins!`);
          }
        }
      } catch (error) {
        console.error('Error executing move:', error);
      }
    }

    function resetPage() {
      location.reload();
    }

    // Initialize on page load
    window.addEventListener('load', loadFighters);
  </script>
</body>
</html>
